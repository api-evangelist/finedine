aid: finedine
name: FineDine
description: >-
  FineDine is an AI-powered restaurant growth platform that helps restaurants increase revenue
  through digital menus (QR code, tablet, and web), online and in-venue ordering, reservations,
  a lite point-of-sale, CRM and loyalty programs, menu-engineering and pricing analytics, and an
  AI business agent (FineDine IQ). It markets to restaurants and hospitality operators with tiered
  SaaS pricing (Starter, Growth, Premium). As of this API Evangelist profiling, FineDine publishes
  no public developer API, SDKs, webhooks, CLI, MCP server, or OpenAPI specification — this profile
  captures its public commercial and content surface. FineDine is backed by 500 Global.
